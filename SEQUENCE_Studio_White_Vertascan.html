<script>
const $=s=>document.querySelector(s),LH=3.2,G=.5;
// type: [label,colour,w,h,wet,daylight,minArea,minDim,class(0 room,1 circulation,2 exterior),height]
const T={living:['Living','#E5B87E',5,4,0,1,12,2.8,0,3],bedroom:['Bedroom','#9FBEDB',4,3.5,0,1,9,2.4,0,3],kitchen:['Kitchen','#E5AC9C',3.5,3.5,1,1,6,1.8,0,3],bath:['Bathroom','#91C8C7',2.5,2,1,0,3.5,1.5,0,3],office:['Office','#AFB5DA',4,4,0,1,8,2.4,0,3],meeting:['Meeting room','#C4AED2',4,3,0,0,8,2.4,0,3],retail:['Retail','#E6C58B',6,5,0,1,15,3,0,3.6],corridor:['Corridor','#D6D9DD',6,1.5,0,0,0,1.1,1,3],lobby:['Lobby','#E5D0A0',4,4,0,0,0,2,1,3],stair:['Stair core','#AEB9C2',3,5,0,0,0,2.4,1,3],mech:['Mech / service','#B8C6B0',2.5,2.5,1,0,0,1.5,0,3],courtyard:['Courtyard','#AECFAE',4,4,0,0,0,2,2,.1]};
const EG={B:[200,300],'R-2':[200,250],'A-3':[200,250],E:[200,250]},OF={B:[150,'g'],'R-2':[200,'g'],'A-3':[15,'n'],E:[20,'n']};
let S={rooms:[],doors:[],level:0,nid:1,occ:'B',spr:true,jur:'',cols:0,rtab:'p'},sel=null,view={x:50,y:50,s:40},U=[],R=[],tab='plan',AN={};
const f1=n=>n.toFixed(1),rm=id=>S.rooms.find(r=>r.id==id),ex=r=>T[r.t][8]==2,cr=r=>T[r.t][8]==1;
function snap(){U.push(JSON.stringify(S));if(U.length>80)U.shift();R=[]}
function undo(){if(U.length){R.push(JSON.stringify(S));S=JSON.parse(U.pop());refresh()}}
function redo(){if(R.length){U.push(JSON.stringify(S));S=JSON.parse(R.pop());refresh()}}
function theme(){const r=document.documentElement,d=r.dataset.theme?r.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark';draw()}
function add(t,x,y){snap();const d=T[t],r={id:S.nid++,t,n:d[0]+' '+S.rooms.filter(q=>q.t==t).length+1,x:0,y:0,w:d[2],h:d[3],l:S.level,ht:d[9]};
 if(x==null){out:for(let yy=0;yy<60;yy+=1)for(let xx=0;xx<60;xx+=1){r.x=xx;r.y=yy;if(!S.rooms.some(o=>o.l==r.l&&ov(r,o)>.01))break out}}else{r.x=Math.round(x/G)*G;r.y=Math.round(y/G)*G}
 S.rooms.push(r);sel=r.id;refresh()}
function ov(a,b){return Math.max(0,Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x))*Math.max(0,Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y))}
function sh(a,b){if(a.l!=b.l)return null;const e=.02,hit=(a1,a2,b1,b2)=>Math.min(a2,b2)-Math.max(a1,b1);
 for(const [p,q] of [[a,b],[b,a]]){
  if(Math.abs(p.x+p.w-q.x)<e){const y1=Math.max(a.y,b.y),y2=Math.min(a.y+a.h,b.y+b.h);if(y2-y1>.01)return{v:1,x:q.x,y:(y1+y2)/2,len:y2-y1}}
  if(Math.abs(p.y+p.h-q.y)<e){const x1=Math.max(a.x,b.x),x2=Math.min(a.x+a.w,b.x+b.w);if(x2-x1>.01)return{v:0,x:(x1+x2)/2,y:q.y,len:x2-x1}}}
 return null}
function genDoors(){snap();const rs=S.rooms.filter(r=>!ex(r)),P=[];
 rs.forEach((a,i)=>rs.slice(i+1).forEach(b=>{const s=sh(a,b);if(s&&s.len>=1)P.push({a,b,s})}));
 const D=[],has=r=>D.some(d=>d.a==r.id||d.b==r.id),put=p=>D.push({a:p.a.id,b:p.b.id,x:p.s.x,y:p.s.y,v:p.s.v});
 P.filter(p=>cr(p.a)&&cr(p.b)).forEach(put);
 rs.filter(r=>!cr(r)).forEach(r=>{const c=P.filter(p=>p.a==r||p.b==r).sort((x,y)=>((cr(y.a)||cr(y.b))-(cr(x.a)||cr(x.b)))||(y.s.len-x.s.len));if(c.length&&!has(r))put(c[0])});
 S.doors=D;refresh()}
function analyze(){
 const I=[],rs=S.rooms,act=rs.filter(r=>!ex(r)),F=(s,r,m,ref,fx)=>I.push({s,id:r&&r.id,m:(r?r.n+': ':'')+m,ref,fx});
 for(let i=0;i<rs.length;i++)for(let j=i+1;j<rs.length;j++){const a=rs[i],b=rs[j];if(a.l==b.l&&ov(a,b)>.01)F('Fail',a,`overlaps ${b.n} by ${ov(a,b).toFixed(2)} m²`,'Geometry','Move or resize one room')}
 S.doors=S.doors.filter(d=>{const a=rm(d.a),b=rm(d.b),s=a&&b&&sh(a,b);if(s){d.x=s.x;d.y=s.y;d.v=s.v}return !!s});
 const adj={};act.forEach(r=>adj[r.id]=[]);S.doors.forEach(d=>{adj[d.a].push(d);adj[d.b].push(d)});
 const dist={};let missing=[];
 [...new Set(act.map(r=>r.l))].forEach(L=>{const on=act.filter(r=>r.l==L);let seeds=on.filter(r=>r.t=='lobby'||r.t=='stair');if(!seeds.length)seeds=on.filter(r=>r.t=='corridor');
  if(!seeds.length){missing.push(L);F('Warning',null,`Level ${L} has no lobby, stair or corridor to act as an entry`,'Circulation','Add a lobby or stair');return}
  const seen=new Set(seeds.map(r=>r.id));seeds.forEach(r=>dist[r.id]=0);
  for(let k=0;k<40;k++)S.doors.forEach(d=>{const a=rm(d.a),b=rm(d.b);if(a.l!=L)return;const w=Math.hypot(a.x+a.w/2-d.x,a.y+a.h/2-d.y)+Math.hypot(b.x+b.w/2-d.x,b.y+b.h/2-d.y);
   [[a,b],[b,a]].forEach(([p,q])=>{if(dist[p.id]!=null&&(dist[q.id]==null||dist[p.id]+w<dist[q.id]-1e-6)){dist[q.id]=dist[p.id]+w;seen.add(q.id)}})});
  on.filter(r=>!seen.has(r.id)).forEach(r=>F('Fail',r,'inaccessible, no door path to an entry or stair','Circulation','Place it beside a corridor and use Generate doors'))});
 act.forEach(r=>{const d=T[r.t];
  if(r.w*r.h<d[6]-.01)F('Warning',r,`area ${f1(r.w*r.h)} m² is below the ${d[6]} m² programme minimum`,'Programme template','Enlarge the room');
  if(Math.min(r.w,r.h)<d[7]-.01)F('Warning',r,`narrow side ${f1(Math.min(r.w,r.h))} m is below ${d[7]} m`,'Programme template','Widen the room');
  if(d[5]){let sl=0;act.forEach(o=>{if(o!=r){const s=sh(r,o);if(s)sl+=s.len}});if(2*(r.w+r.h)-sl<1)F('Warning',r,'no exterior wall for daylight','Daylight','Move to the building edge')}
  if(r.t=='bedroom'&&adj[r.id].length&&adj[r.id].every(x=>{const o=rm(x.a==r.id?x.b:x.a);return T[o.t][4]}))F('Warning',r,'only reached through a wet room','Zoning','Open a door to a corridor or living space');
  if(r.l>0&&r.t!='stair'){const below=rs.filter(o=>o.l==r.l-1&&!ex(o)).reduce((s,o)=>s+ov(r,o),0);if(below<.6*r.w*r.h)F('Warning',r,'less than 60% supported by the level below','Structure (conceptual)','Add a transfer beam or realign walls')}
  if(r.t=='stair'&&r.l>0&&!rs.some(o=>o.t=='stair'&&o.l==r.l-1&&ov(r,o)>.5*r.w*r.h))F('Warning',r,'stair does not continue from the level below','Core alignment','Stack stair cores')});
 const wet=act.filter(r=>T[r.t][4]&&r.t!='mech');
 wet.forEach(r=>{if(!act.some(o=>o!=r&&T[o.t][4]&&sh(r,o)&&sh(r,o).len>=.5))F('Warning',r,'wet room shares no wall with another wet room','Plumbing consolidation','Group it with kitchen, bath or service core')});
 if(S.cols){const c=S.cols,cw=[];rs.filter(r=>r.t=='corridor').forEach(r=>{for(let x=Math.ceil((r.x+.05)/c)*c;x<r.x+r.w-.05;x+=c)for(let y=Math.ceil((r.y+.05)/c)*c;y<r.y+r.h-.05;y+=c)cw.push([r,x,y])});
  cw.slice(0,5).forEach(([r,x,y])=>F('Warning',r,`structural column at (${f1(x)}, ${f1(y)}) sits inside the corridor`,'Structure (conceptual)','Shift the grid or the corridor'))}
 // code matrix
 const C=[],ft=m=>m*3.28084,reach=act.filter(r=>dist[r.id]!=null),mx=Math.max(0,...reach.map(r=>dist[r.id])),lim=EG[S.occ][S.spr?1:0];
 C.push({k:'Exit access travel distance',ref:'IBC 2021 §1017.2, Table 1017.2',st:reach.length?(ft(mx)<=lim?'Pass':'Fail'):'Missing Information',inp:`Occupancy ${S.occ}, sprinklers ${S.spr?'yes':'no'}; longest ${f1(ft(mx))} ft vs ${lim} ft`,me:'Room centre to nearest lobby or stair via door midpoints, straight segments'});

}
try{const a=localStorage.getItem('sequence-autosave');if(a){const d=JSON.parse(a);if(Array.isArray(d.rooms))S={...S,...d}}}catch(e){}
if(!S.rooms.length)sample();else refresh();
</script><script>
/* SEQUENCE 2.0 — enhanced planning controls; local-first and framework-free. */
let activeTool='select',gridVisible=true,sketchMode=false,measureMode=false,toolStart=null;
const defaults=()=>({notes:[],dimensions:[],windows:[],manualDoors:[],project:{name:'Untitled spatial study',designer:'Vertascan',revision:'Concept 01'},snapStep:.5,wallThickness:.15});
function extendState(){for(const [k,v] of Object.entries(defaults()))if(S[k]===undefined)S[k]=structuredClone(v);}
extendState();
function toast(msg){let n=$('#toast');n.textContent=msg;n.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>n.classList.remove('show'),2600)}
function setTool(t){activeTool=t;measureMode=t==='dimension';for(const v of ['select','pan','dimension','note','door','window'])$('#tool'+v[0].toUpperCase()+v.slice(1)).classList.toggle('on',t===v);$('#toolStatus').textContent=t.toUpperCase();toolStart=null;toast(t==='select'?'Select or drag modules':t==='pan'?'Drag empty canvas to pan':t==='note'?'Click canvas to insert a note':t==='dimension'?'Click two points to place a dimension':'Click a shared room edge to place '+t)}
function toggleMeasure(){setTool(activeTool==='dimension'?'select':'dimension');$('#measureBtn').classList.toggle('on',activeTool==='dimension')}
function toggleGrid(){gridVisible=!gridVisible;$('#gridBtn').classList.toggle('on',gridVisible);draw()}
function toggleSketch(){sketchMode=!sketchMode;$('#sketchBtn').classList.toggle('on',sketchMode);draw()}
function newProject(){if(!confirm('Start a new project? Unsaved changes will be cleared.'))return;snap();S={...defaults(),rooms:[],doors:[],level:0,nid:1,occ:'B',spr:true,jur:'',cols:0,rtab:'p'};sel=null;view={x:60,y:90,s:36};refresh();toast('New project ready')}
function downloadText(data,name,type){const blob=new Blob([data],{type});const a=document.createElement('a');const u=URL.createObjectURL(blob);a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function safeName(){return (S.project.name||'sequence').replace(/[^\w-]+/g,'-').slice(0,55)}
function downloadProject(){extendState();downloadText(JSON.stringify({...S,version:'2.0'},null,2),safeName()+'.sequence.json','application/json');toast('Project JSON saved')}
function loadProjectFile(){const i=document.createElement('input');i.type='file';i.accept='.json,.sequence,.txt,application/json';i.onchange=async()=>{const f=i.files?.[0];if(!f)return;try{const obj=JSON.parse(await f.text());loadProjectData(obj);toast('Project opened')}catch(e){toast('Import failed: '+e.message)}};i.click()}
function loadProjectData(obj){if(!obj||!Array.isArray(obj.rooms)||obj.rooms.length>10000)throw Error('Not a valid SEQUENCE project');const rs=obj.rooms.map((r,i)=>{if(!r||!T[r.t])throw Error('Unknown room type');for(const k of ['x','y','w','h','l','ht'])if(!Number.isFinite(+r[k]))throw Error('Invalid numeric geometry');return {id:Number.isSafeInteger(+r.id)?+r.id:i+1,t:r.t,n:String(r.n||T[r.t][0]).slice(0,72),x:+r.x,y:+r.y,w:Math.max(.1,+r.w),h:Math.max(.1,+r.h),l:Math.max(0,Math.min(20,Math.floor(+r.l))),ht:Math.max(.1,+r.ht)}});if(new Set(rs.map(r=>r.id)).size!==rs.length)throw Error('Duplicate room identifiers');snap();S={...defaults(),...obj,occ:EG[obj.occ]?obj.occ:'B',spr:!!obj.spr,rooms:rs,doors:Array.isArray(obj.doors)?obj.doors.filter(d=>rs.some(r=>r.id==d.a)&&rs.some(r=>r.id==d.b)):[],nid:Math.max(1,...rs.map(r=>r.id))+1,level:Math.max(0,Math.min(20,+obj.level||0)),rtab:'p'};for(const key of ['notes','dimensions','windows','manualDoors'])if(!Array.isArray(S[key]))S[key]=[];if(!S.project||typeof S.project!=='object')S.project=defaults().project;sel=null;refresh()}
function fitPlan(){const rooms=S.rooms.filter(r=>r.l==S.level);if(!rooms.length){view={x:80,y:100,s:40};draw();return}const w=svg.clientWidth,h=svg.clientHeight;if(!w||!h)return;const minx=Math.min(...rooms.map(r=>r.x)),miny=Math.min(...rooms.map(r=>r.y)),maxx=Math.max(...rooms.map(r=>r.x+r.w)),maxy=Math.max(...rooms.map(r=>r.y+r.h));view.s=Math.max(8,Math.min(120,Math.min((w-110)/(maxx-minx+1),(h-150)/(maxy-miny+1))));view.x=(w-(maxx+minx)*view.s)/2;view.y=(h-(maxy+miny)*view.s)/2+20;draw()}
function snapPoint(x){return Math.round(x/(S.snapStep||G))*(S.snapStep||G)}
function svgElement(tag,attributes={},content=''){const attrs=Object.entries(attributes).map(([k,v])=>`${k}="${escapeHTML(v)}"`).join(' ');return `<${tag} ${attrs}>${content}</${tag}>`}
function geometryLayer(){extendState();const L=S.level,s=view.s,notes=S.notes.filter(n=>n.l===L),dims=S.dimensions.filter(n=>n.l===L),wins=S.windows.filter(n=>n.l===L),md=S.manualDoors.filter(n=>n.l===L);let o=`<g transform="translate(${view.x} ${view.y}) scale(${s})" pointer-events="none">`;

if(sketchMode)S.rooms.filter(r=>r.l===L).forEach(r=>{const j=.04;o+=`<rect x="${r.x+j}" y="${r.y-j}" width="${r.w}" height="${r.h}" stroke="#272b2c" stroke-width=".025" fill="none" stroke-dasharray=".11 .03"/>`});
for(const n of notes)o+=`<text x="${n.x}" y="${n.y}" fill="var(--ac)" font-size=".36" stroke="var(--p)" stroke-width=".018" paint-order="stroke">${escapeHTML(n.text)}</text>`;
for(const d of dims){const dx=d.x2-d.x1,dy=d.y2-d.y1,len=Math.hypot(dx,dy)||.001,nx=-dy/len*.3,ny=dx/len*.3,x1=d.x1+nx,y1=d.y1+ny,x2=d.x2+nx,y2=d.y2+ny;o+=`<path d="M${x1} ${y1}L${x2} ${y2}M${d.x1} ${d.y1}L${x1+nx*.6} ${y1+ny*.6}M${d.x2} ${d.y2}L${x2+nx*.6} ${y2+ny*.6}" stroke="var(--ac)" fill="none" stroke-width=".035"/><text x="${(x1+x2)/2}" y="${(y1+y2)/2-.08}" text-anchor="middle" fill="var(--ac)" font-size=".28" stroke="var(--p)" stroke-width=".02" paint-order="stroke">${len.toFixed(2)} m</text>`}
for(const n of wins)o+=`<g><rect x="${n.v?n.x-.09:n.x-.55}" y="${n.v?n.y-.55:n.y-.09}" width="${n.v?.18:1.1}" height="${n.v?1.1:.18}" fill="#92d9e9" stroke="#147a9a" stroke-width=".04"/><path d="${n.v?`M${n.x} ${n.y-.55}v1.1`:`M${n.x-.55} ${n.y}h1.1`}" stroke="#fff" stroke-width=".035"/></g>`;
for(const n of md)o+=`<rect x="${n.v?n.x-.05:n.x-.45}" y="${n.v?n.y-.45:n.y-.05}" width="${n.v?.1:.9}" height="${n.v?.9:.1}" stroke="#ba701a" stroke-width=".05" fill="var(--p)"/>`;
if(toolStart)o+=`<circle cx="${toolStart[0]}" cy="${toolStart[1]}" r=".12" stroke="var(--ac)" fill="var(--p)" stroke-width=".05"/>`;
return o+'</g>'}
const basicDraw=draw;draw=function(){basicDraw();if(!gridVisible){const gp=svg.querySelector('#g path');if(gp)gp.style.stroke='none'}svg.insertAdjacentHTML('beforeend',geometryLayer());};
const basicPanels=panels;panels=function(){extendState();basicPanels();const lib=$('#lib'),rp=$('#rp');lib.insertAdjacentHTML('beforeend',`<h4>Project tools</h4><div class="panel-actions"><button onclick="fitPlan()">Fit view</button><button onclick="duplicateLevel()">Copy floor</button><button onclick="addLevel()">+ Level</button></div><h4>Planning options</h4><div class="row"><label>Snap (m)</label><select id="snapOpt" onchange="S.snapStep=+this.value;refresh()">${[.1,.25,.5,1].map(n=>`<option value="${n}" ${S.snapStep===n?'selected':''}>${n}</option>`).join('')}</select></div><div class="row"><label>Wall (m)</label><input type="number" min=".05" max=".6" step=".05" value="${S.wallThickness}" onchange="S.wallThickness=Math.min(.6,Math.max(.05,+this.value||.15));refresh()"></div><h4>Quick actions</h4><div class="panel-actions"><button onclick="autoPack()">Arrange modules</button><button onclick="cleanDoors()">Rebuild doors</button></div><p class="secondary-text">Rooms remain editable parametric modules. Doors, windows and conceptual dimension marks can be placed on the 2D canvas.</p>`);
const proj=S.project;rp.insertAdjacentHTML('beforeend',`<h4>Project information</h4><div class="row"><label>Project</label><input value="${escapeHTML(proj.name||'')}" onchange="S.project.name=this.value.slice(0,120);refresh()"></div><div class="row"><label>Designer</label><input value="${escapeHTML(proj.designer||'')}" onchange="S.project.designer=this.value.slice(0,100);refresh()"></div><div class="row"><label>Revision</label><input value="${escapeHTML(proj.revision||'')}" onchange="S.project.revision=this.value.slice(0,50);refresh()"></div><h4>Drawing output</h4><div class="panel-actions"><button onclick="downloadSVG()">SVG plan</button><button onclick="downloadCSV()">CSV schedule</button><button onclick="downloadDXF()">DXF geometry</button></div><div class="metricstrip"><div class="metric"><b>${S.rooms.length}</b><small>Spatial modules</small></div><div class="metric"><b>${(AN.g||0).toFixed(1)} m²</b><small>Gross room area</small></div><div class="metric"><b>${S.doors.length+S.manualDoors.length}</b><small>Door connections</small></div><div class="metric"><b>${S.windows.length}</b><small>Windows</small></div></div><p class="secondary-text">Code results are approximate concept checks, not a permit or engineering compliance certificate. Travel paths use room-centre estimates; wall thickness, exit discharge, accessibility clearances and local amendments need independent verification.</p>`);
const lv=$('#lv');lv.innerHTML=Array.from({length:Math.max(4,Math.min(21,1+Math.max(S.level,...S.rooms.map(r=>r.l))))},(_,i)=>`<option value="${i}" ${S.level===i?'selected':''}>Level ${i}</option>`).join('');$('#sn').textContent=`Snap ${S.snapStep} m · edge magnet`;
};
function duplicateLevel(){const src=S.rooms.filter(r=>r.l===S.level);if(!src.length)return toast('This level has no rooms');if(S.level>=20)return toast('Maximum 20 levels');snap();let target=S.level+1;const ids=new Map;for(const r of src){const id=S.nid++;ids.set(r.id,id);S.rooms.push({...r,id,l:target,n:r.n+' L'+target})}S.level=target;sel=null;refresh();toast('Copied '+src.length+' modules to level '+target)}
function addLevel(){if(S.level>=20)return toast('Maximum 20 levels');S.level++;sel=null;refresh();toast('Level '+S.level)}
function cleanDoors(){genDoors();toast('Door connections recalculated')}
function autoPack(){const rr=S.rooms.filter(r=>r.l===S.level&&!ex(r));if(!rr.length)return toast('Add modules first');if(!confirm('Arrange current-level modules into rows? Positions will be updated.'))return;snap();const gap=.0,limit=Math.max(12,Math.sqrt(rr.reduce((a,r)=>a+r.w*r.h,0))*1.35);let x=0,y=0,rowH=0;for(const r of rr){if(x&&x+r.w>limit){x=0;y+=rowH+gap;rowH=0}r.x=x;r.y=y;x+=r.w+gap;rowH=Math.max(rowH,r.h)}S.doors=[];refresh();fitPlan();toast('Modules arranged; review adjacency and regenerate doors')}
function downloadSVG(){const clone=svg.cloneNode(true);clone.setAttribute('xmlns','http://www.w3.org/2000/svg');const b=svg.getBoundingClientRect();clone.setAttribute('width',Math.round(b.width)||1200);clone.setAttribute('height',Math.round(b.height)||800);clone.setAttribute('viewBox',`0 0 ${Math.round(b.width)||1200} ${Math.round(b.height)||800}`);let xml=clone.outerHTML.replace(/var\(--([a-z-]+)\)/g,(m,k)=>getComputedStyle(document.documentElement).getPropertyValue('--'+k).trim()||'#999');downloadText(xml,safeName()+'-L'+S.level+'.svg','image/svg+xml');toast('Current view exported as SVG')}
function csvCell(x){return '"'+String(x??'').replaceAll('"','""')+'"'}
function downloadCSV(){const lines=[['ID','Level','Name','Type','X m','Y m','Width m','Length m','Height m','Area m2','Volume m3'],...S.rooms.map(r=>[r.id,r.l,r.n,T[r.t][0],r.x,r.y,r.w,r.h,r.ht,(r.w*r.h).toFixed(2),(r.w*r.h*r.ht).toFixed(2)])];downloadText(lines.map(row=>row.map(csvCell).join(',')).join('\r\n'),safeName()+'-schedule.csv','text/csv');toast('Room schedule exported')}
function downloadDXF(){let d=['0','SECTION','2','HEADER','9','$ACADVER','1','AC1015','0','ENDSEC','0','SECTION','2','ENTITIES'];const line=(x1,y1,x2,y2,layer)=>{d.push('0','LINE','8',layer,'10',String(x1*1000),'20',String(-y1*1000),'30','0','11',String(x2*1000),'21',String(-y2*1000),'31','0')};for(const r of S.rooms){const l=`A-SPACE-L${r.l}`;line(r.x,r.y,r.x+r.w,r.y,l);line(r.x+r.w,r.y,r.x+r.w,r.y+r.h,l);line(r.x+r.w,r.y+r.h,r.x,r.y+r.h,l);line(r.x,r.y+r.h,r.x,r.y,l)}for(const t of S.dimensions)line(t.x1,t.y1,t.x2,t.y2,'A-DIMS');d.push('0','ENDSEC','0','EOF');downloadText(d.join('\n'),safeName()+'.dxf','application/dxf');toast('2D room boundaries exported in millimetres (DXF)')}
function findEdge(x,y){let best=null,min=.24;for(const r of S.rooms.filter(r=>r.l===S.level)){for(const v of [true,false]){for(const side of [0,1]){const a=v?(side?r.x+r.w:r.x):(side?r.y+r.h:r.y),lo=v?r.y:r.x,hi=lo+(v?r.h:r.w),p=v?x:y,q=v?y:x;if(q>=lo+.4&&q<=hi-.4&&Math.abs(p-a)<min){min=Math.abs(p-a);best={r,v,x:v?a:q,y:v?q:a}}}}}return best}
svg.addEventListener('pointerdown',e=>{if(activeTool==='select'||activeTool==='pan')return;e.stopImmediatePropagation();e.preventDefault();const [rx,ry]=W(e),x=snapPoint(rx),y=snapPoint(ry);if(activeTool==='note'){const msg=prompt('Annotation text');if(msg?.trim()){snap();S.notes.push({id:Date.now(),x,y,l:S.level,text:msg.trim().slice(0,120)});refresh()}return}if(activeTool==='dimension'){if(!toolStart){toolStart=[x,y];draw();toast('Choose dimension end point')}else{snap();S.dimensions.push({x1:toolStart[0],y1:toolStart[1],x2:x,y2:y,l:S.level});toolStart=null;refresh()}return}if(activeTool==='door'||activeTool==='window'){const hit=findEdge(rx,ry);if(!hit)return toast('Click near an existing room edge');snap();const pt={x:hit.x,y:hit.y,v:hit.v,l:S.level};(activeTool==='door'?S.manualDoors:S.windows).push(pt);refresh();toast(activeTool+' placed')}
},true);
svg.addEventListener('pointerdown',e=>{if(activeTool==='pan'&&e.target.closest('[data-id]')){e.stopImmediatePropagation();const [x,y]=W(e);md={k:'pan',sx:e.clientX-view.x,sy:e.clientY-view.y}}},true);
const oldKeys=undefined;
window.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='Escape'){setTool('select');return}if(e.key.toLowerCase()==='f')fitPlan();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();downloadProject()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='o'){e.preventDefault();loadProjectFile()}},true);
const originalSample=sample;sample=function(){originalSample();fitPlan()};
const originalRefresh=refresh;refresh=function(){extendState();originalRefresh()};
const originalImport=importMenu;importMenu=function(){originalImport();$('#mb').onclick=()=>{try{loadProjectData(JSON.parse($('#mt').value));$('#modal').style.display='none';toast('Project loaded')}catch(e){$('#mn').textContent=e.message||'Invalid SEQUENCE project'}}};
// Default study is the original sample. Display the entire model on load.
refresh();fitPlan();

</script></body></html>
